name: release

# Builds the hypercrux binaries, checks each one, and publishes them with a
# release, for 0.x and for the Beta.
#
# Releases go out on their own. When the tests pass on a push to main and the
# version in hypercrux.go has no tag yet, this workflow builds and checks
# 0.x's binaries from that commit, then tags it and publishes the release
# with the binaries attached. The Beta's go out the same way (task R4), from
# the version in beta/hypercrux/hypercrux.go, once the test and beta
# workflows have both passed on the commit, and as a pre-release, so the
# repository's latest release stays 0.x's. Nothing goes public unless every
# build and check passes. scripts/release-plan.py has the plan's rules, and
# RELEASING.md the whole procedure.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag, or to make
# a dry run of the Beta's release, which builds and checks its binaries and
# writes the checksums and the notes, and publishes nothing.

on:
  workflow_run:
    workflows: [test, beta]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build again, such as v0.1.0 or v0.3.0-beta.1"
        required: false
        default: ""
      dry_run:
        description: "Or, for a dry run of the Beta's release, the version to rehearse, such as 0.3.0-beta.1: builds and checks its binaries from this branch, and publishes nothing"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # 0.x's plan: after the test workflow alone, as before the Beta's release.
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ github.sha }}
        run: python3 scripts/release-plan.py 0.x

  linux:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build a static binary
        env:
          CC: musl-gcc
          CGO_ENABLED: "1"
        run: >
          go build -trimpath -tags 'sqlite_omit_load_extension netgo osusergo'
          -ldflags '-s -w -linkmode external -extldflags "-static"' -o hypercrux ./cmd/hypercrux
      - run: file hypercrux && sh scripts/smoke.sh ./hypercrux
      - name: Package
        run: |
          mkdir pkg && cp hypercrux LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          tar -czf hypercrux_linux_${{ matrix.arch }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: hypercrux_linux_${{ matrix.arch }}
          path: hypercrux_linux_${{ matrix.arch }}.tar.gz

  macos:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      matrix:
        include:
          - arch: arm64
            clang: arm64
          - arch: amd64
            clang: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.arch }}
          CC: clang -arch ${{ matrix.clang }}
        run: go build -trimpath -tags sqlite_omit_load_extension -ldflags '-s -w' -o hypercrux ./cmd/hypercrux
      - run: file hypercrux
      - if: matrix.arch == 'arm64'
        run: sh scripts/smoke.sh ./hypercrux
      - name: Package
        run: |
          mkdir pkg && cp hypercrux LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          tar -czf hypercrux_darwin_${{ matrix.arch }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: hypercrux_darwin_${{ matrix.arch }}
          path: hypercrux_darwin_${{ matrix.arch }}.tar.gz

  windows:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
      - name: Build
        env:
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -tags sqlite_omit_load_extension -ldflags '-s -w' -o hypercrux.exe ./cmd/hypercrux
      - name: Package
        run: |
          file hypercrux.exe
          mkdir pkg && cp hypercrux.exe LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          (cd pkg && zip -q ../hypercrux_windows_amd64.zip *)
      - uses: actions/upload-artifact@v7
        with:
          name: hypercrux_windows_amd64
          path: hypercrux_windows_amd64.zip

  windows-check:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hypercrux_windows_amd64
      - name: Run the Windows binary
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Expand-Archive hypercrux_windows_amd64.zip -DestinationPath bin
          $hc = Resolve-Path bin\hypercrux.exe
          & $hc version
          '{"name": "Dana"}' | & $hc put check.db customer:42
          '{"title": "one", "vec": [1, 0]}' | & $hc put check.db docs:1
          '{"title": "two", "vec": [0, 1]}' | & $hc put check.db docs:2
          & $hc link check.db customer:42 owns docs:1
          & $hc export check.db | & $hc import copy.db
          $one = (& $hc export check.db) -join "`n"
          $two = (& $hc export copy.db) -join "`n"
          if ($one -cne $two) { throw "the copy exports differently" }
          $near = & $hc nearest check.db docs '[1,0]' -k 1
          if ("$near" -notmatch 'docs:1') { throw "nearest gave $near" }
          $walk = & $hc walk check.db customer:42 1
          if ("$walk" -notmatch 'docs:1') { throw "walk gave $walk" }
          & $hc delete check.db docs:1
          & $hc check check.db
          Write-Output "windows check passed"

  release:
    needs: [plan, linux, macos, windows, windows-check]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # 0.x's archives alone, since the Beta's can be in the same run.
      - uses: actions/download-artifact@v8
        with:
          pattern: hypercrux_*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<'EOF'
          Ready-built hypercrux binaries. Each archive holds the `hypercrux` command with its license files.

          | System | File |
          |---|---|
          | Linux, x86-64 (static) | hypercrux_linux_amd64.tar.gz |
          | Linux, ARM64 (static) | hypercrux_linux_arm64.tar.gz |
          | macOS, Apple silicon | hypercrux_darwin_arm64.tar.gz |
          | macOS, Intel | hypercrux_darwin_amd64.tar.gz |
          | Windows, x86-64 | hypercrux_windows_amd64.zip |

          SHA256SUMS lists the checksums. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or you can run `xattr -d com.apple.quarantine hypercrux`.
          EOF
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "HyperCrux $TAG" --notes-file ../notes.md \
            hypercrux_linux_amd64.tar.gz hypercrux_linux_arm64.tar.gz hypercrux_darwin_arm64.tar.gz hypercrux_darwin_amd64.tar.gz hypercrux_windows_amd64.zip SHA256SUMS
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            hypercrux_linux_amd64.tar.gz hypercrux_linux_arm64.tar.gz hypercrux_darwin_arm64.tar.gz hypercrux_darwin_amd64.tar.gz hypercrux_windows_amd64.zip SHA256SUMS
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi

  # The Beta's plan (task R4): after the test and the beta workflows have
  # both passed on the commit, so it reads the other workflow's runs.
  beta-plan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_WORKFLOW: ${{ github.event.workflow_run.name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-plan.py beta

  # The Beta's binaries, each built and checked on its own architecture's
  # machine. A dry run builds the version it rehearses, set in this job's
  # checkout alone. Each check's result is a notice, which the REST API
  # shows where a cloud session can't read the log.
  beta-linux:
    needs: beta-plan
    if: needs.beta-plan.outputs.tag != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      VERSION: ${{ needs.beta-plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.beta-plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Set the version a dry run rehearses
        if: needs.beta-plan.outputs.mode == 'dry-run'
        run: sh scripts/beta-release.sh stamp "$VERSION"
      - name: Build a static binary
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags '-s -w' -o hypercrux ./beta/cmd/hypercrux
      - name: Check it is static, names the version and passes the smoke test
        run: sh scripts/beta-release.sh check ./hypercrux "$ARCH" "$VERSION"
      - name: Package
        run: sh scripts/beta-release.sh package ./hypercrux "$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: hypercrux-beta_linux_${{ matrix.arch }}
          path: hypercrux-beta_linux_${{ matrix.arch }}.tar.gz

  beta-release:
    needs: [beta-plan, beta-linux]
    if: needs.beta-plan.outputs.mode == 'release' || needs.beta-plan.outputs.mode == 'attach'
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.beta-plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.beta-plan.outputs.tag }}
      REF: ${{ needs.beta-plan.outputs.ref }}
      MODE: ${{ needs.beta-plan.outputs.mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.beta-plan.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: hypercrux-beta_linux_*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          sh scripts/beta-release.sh sums dist
          sh scripts/beta-release.sh notes "$TAG" notes.md "$MODE" "$REF"
      - name: Tag the commit and publish the pre-release, binaries attached
        if: env.MODE == 'release'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "HyperCrux $TAG" --notes-file ../notes.md --prerelease --latest=false \
            hypercrux-beta_linux_amd64.tar.gz hypercrux-beta_linux_arm64.tar.gz SHA256SUMS
      - name: Attach the binaries to an existing release, and keep it a pre-release
        if: env.MODE == 'attach'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            hypercrux-beta_linux_amd64.tar.gz hypercrux-beta_linux_arm64.tar.gz SHA256SUMS
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
          # A full release of the Beta could become the latest, whose files the
          # site's download page links to, and those are 0.x's.
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" != true ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false
          fi

  # A dry run of the Beta's release ends here, with the checksums and the
  # notes kept beside the binaries as the run's artifacts. This job has the
  # workflow's permissions, contents: read, so it can't tag or publish.
  beta-dry-run:
    needs: [beta-plan, beta-linux]
    if: needs.beta-plan.outputs.mode == 'dry-run'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.beta-plan.outputs.tag }}
      REF: ${{ needs.beta-plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.beta-plan.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          pattern: hypercrux-beta_linux_*
          path: dist
          merge-multiple: true
      - name: Checksums and notes, as the release would have them
        run: |
          sh scripts/beta-release.sh sums dist
          sh scripts/beta-release.sh notes "$TAG" dist/notes.md dry-run "$REF"
      - uses: actions/upload-artifact@v7
        with:
          name: hypercrux-beta_dry-run
          path: |
            dist/SHA256SUMS
            dist/notes.md

name: release

# Builds the hypercrux binaries, checks each one, and publishes them with a
# release.
#
# Releases go out on their own. When the tests pass on a push to main and the
# version in hypercrux.go has no tag yet, this workflow builds and checks the
# binaries from that commit, then tags it and publishes the release with the
# binaries attached. Nothing goes public unless every build and check passes.
#
# It also attaches binaries to a release someone publishes by hand, and it
# can be run by hand to rebuild the binaries of an existing tag.

on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.1.0"
        required: true

permissions:
  contents: read

jobs:
  plan:
    # After the tests, only for a push to main in this repository that passed.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      ref: ${{ steps.plan.outputs.ref }}
      new: ${{ steps.plan.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          case "$EVENT" in
          workflow_run)
            # Only the commit main is at now; if main has moved on, the run
            # after the next push decides.
            head=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$head" != "$RUN_SHA" ]; then
              echo "No release: main has moved on from $RUN_SHA to $head."
              exit 0
            fi
            version=$(sed -n 's/^const Version = "\([0-9]*\.[0-9]*\.[0-9]*\)"$/\1/p' hypercrux.go)
            if [ -z "$version" ]; then
              echo "hypercrux.go has no Version of the form X.Y.Z" >&2
              exit 1
            fi
            tags=$(git ls-remote --tags --refs origin) || { echo "Couldn't read the repository's tags" >&2; exit 1; }
            if grep -q "refs/tags/v$version\$" <<< "$tags"; then
              echo "No release: v$version is out already."
              exit 0
            fi
            newest=$({ grep -o 'refs/tags/v[0-9]*\.[0-9]*\.[0-9]*$' <<< "$tags" || true; } | sed 's|refs/tags/v||' | sort -V | tail -n 1)
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$version" | sort -V | tail -n 1)" != "$version" ]; then
              echo "v$version is older than the newest release, v$newest; raise the version above it" >&2
              exit 1
            fi
            echo "Releasing v$version from $RUN_SHA."
            { echo "tag=v$version"; echo "ref=$RUN_SHA"; echo "new=true"; } >> "$GITHUB_OUTPUT"
            ;;
          release)
            { echo "tag=$RELEASE_TAG"; echo "ref=$RELEASE_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          workflow_dispatch)
            { echo "tag=$INPUT_TAG"; echo "ref=$INPUT_TAG"; } >> "$GITHUB_OUTPUT"
            ;;
          esac

  linux:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - name: Build a static binary
        env:
          CC: musl-gcc
          CGO_ENABLED: "1"
        run: >
          go build -trimpath -tags 'sqlite_omit_load_extension netgo osusergo'
          -ldflags '-s -w -linkmode external -extldflags "-static"' -o hypercrux ./cmd/hypercrux
      - run: file hypercrux && sh scripts/smoke.sh ./hypercrux
      - name: Package
        run: |
          mkdir pkg && cp hypercrux LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          tar -czf hypercrux_linux_${{ matrix.arch }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: hypercrux_linux_${{ matrix.arch }}
          path: hypercrux_linux_${{ matrix.arch }}.tar.gz

  macos:
    needs: plan
    if: needs.plan.outputs.tag != ''
    strategy:
      matrix:
        include:
          - arch: arm64
            clang: arm64
          - arch: amd64
            clang: x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOARCH: ${{ matrix.arch }}
          CC: clang -arch ${{ matrix.clang }}
        run: go build -trimpath -tags sqlite_omit_load_extension -ldflags '-s -w' -o hypercrux ./cmd/hypercrux
      - run: file hypercrux
      - if: matrix.arch == 'arm64'
        run: sh scripts/smoke.sh ./hypercrux
      - name: Package
        run: |
          mkdir pkg && cp hypercrux LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          tar -czf hypercrux_darwin_${{ matrix.arch }}.tar.gz -C pkg .
      - uses: actions/upload-artifact@v7
        with:
          name: hypercrux_darwin_${{ matrix.arch }}
          path: hypercrux_darwin_${{ matrix.arch }}.tar.gz

  windows:
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 zip
      - name: Build
        env:
          CC: x86_64-w64-mingw32-gcc
          CGO_ENABLED: "1"
          GOOS: windows
          GOARCH: amd64
        run: go build -trimpath -tags sqlite_omit_load_extension -ldflags '-s -w' -o hypercrux.exe ./cmd/hypercrux
      - name: Package
        run: |
          file hypercrux.exe
          mkdir pkg && cp hypercrux.exe LICENSE NOTICE THIRD_PARTY_LICENSES.md README.md pkg/
          (cd pkg && zip -q ../hypercrux_windows_amd64.zip *)
      - uses: actions/upload-artifact@v7
        with:
          name: hypercrux_windows_amd64
          path: hypercrux_windows_amd64.zip

  windows-check:
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hypercrux_windows_amd64
      - name: Run the Windows binary
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Expand-Archive hypercrux_windows_amd64.zip -DestinationPath bin
          $hc = Resolve-Path bin\hypercrux.exe
          & $hc version
          '{"name": "Dana"}' | & $hc put check.db customer:42
          '{"title": "one", "vec": [1, 0]}' | & $hc put check.db docs:1
          '{"title": "two", "vec": [0, 1]}' | & $hc put check.db docs:2
          & $hc link check.db customer:42 owns docs:1
          & $hc export check.db | & $hc import copy.db
          $one = (& $hc export check.db) -join "`n"
          $two = (& $hc export copy.db) -join "`n"
          if ($one -cne $two) { throw "the copy exports differently" }
          $near = & $hc nearest check.db docs '[1,0]' -k 1
          if ("$near" -notmatch 'docs:1') { throw "nearest gave $near" }
          $walk = & $hc walk check.db customer:42 1
          if ("$walk" -notmatch 'docs:1') { throw "walk gave $walk" }
          & $hc delete check.db docs:1
          & $hc check check.db
          Write-Output "windows check passed"

  release:
    needs: [plan, linux, macos, windows, windows-check]
    # Two runs for the same tag take turns; the second finds it published.
    concurrency:
      group: release-${{ needs.plan.outputs.tag }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      REF: ${{ needs.plan.outputs.ref }}
      NEW: ${{ needs.plan.outputs.new }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          cat > ../notes.md <<'EOF'
          Ready-built hypercrux binaries. Each archive holds the `hypercrux` command with its license files.

          | System | File |
          |---|---|
          | Linux, x86-64 (static) | hypercrux_linux_amd64.tar.gz |
          | Linux, ARM64 (static) | hypercrux_linux_arm64.tar.gz |
          | macOS, Apple silicon | hypercrux_darwin_arm64.tar.gz |
          | macOS, Intel | hypercrux_darwin_amd64.tar.gz |
          | Windows, x86-64 | hypercrux_windows_amd64.zip |

          SHA256SUMS lists the checksums. The macOS binaries aren't signed by Apple, so macOS may ask you to allow them the first time, or you can run `xattr -d com.apple.quarantine hypercrux`.
          EOF
      - name: Tag the commit and publish the release, binaries attached
        if: env.NEW == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is out already."
            exit 0
          fi
          cd dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$REF" \
            --title "HyperCrux $TAG" --notes-file ../notes.md \
            hypercrux_linux_amd64.tar.gz hypercrux_linux_arm64.tar.gz hypercrux_darwin_arm64.tar.gz hypercrux_darwin_amd64.tar.gz hypercrux_windows_amd64.zip SHA256SUMS
      - name: Attach the binaries to an existing release
        if: env.NEW != 'true'
        run: |
          cd dist
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            hypercrux_linux_amd64.tar.gz hypercrux_linux_arm64.tar.gz hypercrux_darwin_arm64.tar.gz hypercrux_darwin_amd64.tar.gz hypercrux_windows_amd64.zip SHA256SUMS
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          if [ -z "$body" ]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file ../notes.md
          fi
